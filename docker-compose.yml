services:
  backend:
    build:
      context: ./BE
      dockerfile: Dockerfile
    image: chillshrimp-backend:latest
    env_file:
      - ./BE/.env
    environment:
      PORT: 8000
      FRONTEND_URL: http://localhost:5173
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./FE
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    image: chillshrimp-frontend:latest
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    restart: unless-stopped
