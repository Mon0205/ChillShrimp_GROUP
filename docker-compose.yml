services:
  ai-service:
    build:
      context: ./AI_SERVICE
      dockerfile: Dockerfile
    image: chillshrimp-ai-service:latest
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001", "--reload", "--reload-dir", "/app/app"]
    volumes:
      - ./AI_SERVICE/app:/app/app
    env_file:
      - path: ./AI_SERVICE/.env
        required: false
    environment:
      WATCHFILES_FORCE_POLLING: "true"
      MODEL_PATH: /app/models/best.pt
      MODEL_VERSION: v8_yolo26s_seed0
      CLOUDINARY_INSPECTION_FOLDER: chillshrimp/ai-inspections/originals
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  backend:
    build:
      context: ./BE
      dockerfile: Dockerfile
    image: chillshrimp-backend:latest
    entrypoint: ["sh", "-c", "node scripts/migrate.js deploy && exec ./node_modules/.bin/nodemon --legacy-watch src/server.js"]
    volumes:
      - ./BE/src:/app/src
    env_file:
      - ./BE/.env
    environment:
      PORT: 8000
      FRONTEND_URL: http://localhost:5173
      AI_SERVICE_URL: http://ai-service:8001
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./FE
      dockerfile: Dockerfile
      target: dev
      args:
        VITE_API_URL: /api
    image: chillshrimp-frontend:dev
    environment:
      VITE_API_URL: /api
      VITE_PROXY_TARGET: http://backend:8000
      VITE_USE_POLLING: "true"
    volumes:
      - ./FE/src:/app/src
      - ./FE/index.html:/app/index.html
      - ./FE/vite.config.js:/app/vite.config.js
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:5173"
    restart: unless-stopped
